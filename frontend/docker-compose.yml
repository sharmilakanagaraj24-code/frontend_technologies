version: '3.8'

services:
  # 1. MySQL Relational Database
  mysql:
    image: mysql:8.0
    container_name: job_portal_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: job_portal_db
      MYSQL_USER: jobuser
      MYSQL_PASSWORD: jobpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - jobportal_net

  # 2. Python Scikit-learn AI/ML Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: job_portal_ml
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - jobportal_net

  # 3. Java Spring Boot REST Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_portal_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=job_portal_db
      - DB_USER=jobuser
      - DB_PASSWORD=jobpassword
      - ML_SERVICE_URL=http://ml-service:5000
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - jobportal_net

  # 4. React Frontend Web Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_portal_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_ML_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - jobportal_net

volumes:
  mysql_data:

networks:
  jobportal_net:
    driver: bridge
